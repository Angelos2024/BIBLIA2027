<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Génesis · capas</title>
<style>
:root {
  --morph-lang-size: 1.08rem;
  --morph-hebrew-size: calc(1.08rem * 1.14);
  --morph-label-size: calc(1.08rem * 0.66);
  --bg: #edddce; --bd: #d5c1b1; --text: #2c1d1f; --muted: #6d5d52;
  --primary: #4b2743; --gr: #395a93; --sp: #b42318;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; }
.top {
  position: sticky; top: 0; z-index: 8;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 18px; background: #fffaf4; border-bottom: 1px solid var(--bd);
}
.top b { font-size: 1rem; }
.toggles { display: flex; gap: 14px; font-size: .9rem; }
.toggles label { cursor: pointer; display: flex; align-items: center; gap: 5px; user-select: none; }
select { font: inherit; padding: 3px 6px; border: 1px solid var(--bd); border-radius: 6px; background: #fff; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px; }
.card {
  background: #fff; border: 1px solid rgba(75,39,67,.14); border-radius: 18px;
  overflow: hidden; box-shadow: 0 12px 28px rgba(15,23,42,.06);
}
.head {
  display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start;
  padding: .65rem 1.1rem .6rem;
  background: linear-gradient(180deg, rgba(237,221,206,.42) 0%, rgba(255,255,255,.92) 100%);
  border-bottom: 1px solid rgba(75,39,67,.12);
}
.ref { font-weight: 700; }
.meta { font-size: .82rem; color: var(--muted); }
.lxx-chip { font-size: .82rem; color: var(--gr); text-align: right; max-width: 62%; line-height: 1.4; }
.lxx-chip span { opacity: .7; font-size: .72rem; display: block; }
.strip {
  display: flex; flex-direction: row; flex-wrap: wrap; direction: rtl;
  align-items: flex-start; padding: .85rem 1.1rem 1rem;
}
.col {
  min-width: 4.6rem; max-width: 6.8rem; padding: 6px 8px 8px;
  text-align: center; border-right: 1px solid #efe6dc;
  overflow: hidden; flex: 0 0 auto; isolation: isolate;
}
.col.add { background: #eef3fb; border-left: 2px solid rgba(57,90,147,.4); }
.col.spadd { background: #fdeeee; border-left: 2px solid rgba(180,35,24,.35); }
.he {
  font-family: "SBL Hebrew","Ezra SIL","Times New Roman",serif;
  font-size: var(--morph-hebrew-size); direction: rtl; min-height: 1.5rem; color: #24181a;
}
.col.add .he, .marker {
  font-family: system-ui, sans-serif; font-size: .65rem; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; color: var(--gr); min-height: auto;
}
.col.spadd .marker { color: var(--sp); }
.morph {
  font-size: var(--morph-label-size); color: #9a6b3a; margin: 2px auto 0;
  letter-spacing: .02em; font-weight: 600; line-height: 1.22;
  max-width: 11ch; word-break: break-all; overflow-wrap: anywhere;
}
.es { font-size: calc(var(--morph-lang-size) * .78); margin-top: 3px; min-height: 1.15em; }
.es-sp { color: var(--sp); font-weight: 700; }
.hide-sp .es-sp { display: none; }
.gr {
  font-family: "SBL Greek","GFS Didot","Times New Roman",serif;
  font-size: .82rem; color: var(--gr); margin-top: 3px;
}
.sp {
  font-family: "SBL Hebrew","Ezra SIL","Times New Roman",serif;
  font-size: 1.05rem; direction: rtl; margin-top: 5px; color: #6a5348;
}
.sp.eq { color: #d2c4b6; font-size: .7rem; }
.sp-add {
  margin-top: 6px; padding-top: 4px; border-top: 1px dashed rgba(180,35,24,.35);
  color: var(--sp);
}
.sp-add-he {
  font-family: "SBL Hebrew","Ezra SIL","Times New Roman",serif;
  font-size: 1.05rem; direction: rtl; font-weight: 700;
}
.hide-morph .morph { display: none; }
.hide-lxx .gr, .hide-lxx .lxx-chip, .hide-lxx .col.add .marker { display: none; }
.hide-lxx .col.add > .morph { display: none; }
.hide-lxx .col.add:not(.has-sp-plus) { display: none; }
.hide-lxx.hide-sp .col.add { display: none; }
.hide-sp .sp, .hide-sp .sp-add, .hide-sp .col.spadd { display: none; }
.card:not(.hide-sp) .has-sp-plus .es-mt { display: none; }
.personal {
  padding: .55rem 1.1rem .85rem; font-size: .95rem; line-height: 1.5;
  border-top: 1px solid rgba(75,39,67,.1);
}
.personal .lab { color: #1f6b3a; font-size: .72rem; font-weight: 700; letter-spacing: .08em; margin-right: 8px; }
</style>
</head>
<body>
<div class="top">
  <b>Génesis</b>
  <label>Cap. <select id="ch"></select></label>
  <label>v. <select id="vs"></select></label>
  <div class="toggles">
    <label><input type="checkbox" id="lay-morph" checked> Morfología</label>
    <label><input type="checkbox" id="lay-lxx" checked> LXX</label>
    <label><input type="checkbox" id="lay-sp"> Samaritano</label>
  </div>
</div>
<div class="wrap"><div class="card" id="card"></div></div>
<script>
const DATA_URL = 'genesis_1_10_c4.json';
const card = document.getElementById('card');
const chSel = document.getElementById('ch');
const vsSel = document.getElementById('vs');
let data = null;
let ch = 4, vs = 8;

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function layers() {
  card.classList.toggle('hide-morph', !document.getElementById('lay-morph').checked);
  card.classList.toggle('hide-lxx', !document.getElementById('lay-lxx').checked);
  card.classList.toggle('hide-sp', !document.getElementById('lay-sp').checked);
}

function tokenHtml(t) {
  const isPlus = !!(t.esSp || t.spRed);
  const cls = (t.k === 'add' ? 'col add' : t.k === 'spadd' ? 'col spadd' : 'col')
            + (isPlus ? ' has-sp-plus' : '');
  const marker = t.k === 'add' ? '<div class="marker">+ LXX</div><div class="morph">ADD</div>'
              : t.k === 'spadd' ? '<div class="marker">ADD TS</div><div class="morph">ADD TS</div>'
              : `<div class="he">${t.he ? esc(t.he) : '—'}</div><div class="morph">${esc(t.morph || '—')}</div>`;
  const esSp = (isPlus && t.esSp)
    ? `<div class="es es-sp">${esc(t.esSp)}</div>` : '';
  const esMt = `<div class="es es-mt">${esc(t.es || '—')}</div>`;
  const gr = `<div class="gr">${t.gr ? esc(t.gr) : '—'}</div>`;
  let sp = '';
  if (isPlus && t.sp) {
    sp = `<div class="sp-add"><div class="sp-add-he">${esc(t.sp)}</div></div>`;
  } else if (t.k === 'he' || t.k === 'pre') {
    sp = t.sp
      ? `<div class="sp">${esc(t.sp)}</div>`
      : '<div class="sp eq">＝</div>';
  }
  return `<div class="${cls}">${marker}${esSp}${esMt}${gr}${sp}</div>`;
}

function render() {
  const v = data.chapters[String(ch)][String(vs)];
  if (!v) { card.innerHTML = ''; return; }
  const nAdd = v.nAdd || 0;
  card.innerHTML = `
    <div class="head">
      <div>
        <div class="ref">Génesis ${ch}:${vs}</div>
        <div class="meta">${nAdd ? nAdd + ' ADD LXX · ' : ''}${v.tokens.length} unidades</div>
      </div>
      <div class="lxx-chip" dir="ltr" lang="el">
        <span>LXX (GEN) ${ch}:${vs}</span>
        ${esc(v.lxx || '')}
      </div>
    </div>
    <div class="strip">${v.tokens.map(tokenHtml).join('')}</div>
    <div class="personal"><span class="lab">PERSONAL</span>${v.personalHtml || esc(v.personal || '')}</div>`;
  layers();
}

function fillVerses() {
  const nums = Object.keys(data.chapters[String(ch)]).map(Number).sort((a,b)=>a-b);
  vsSel.innerHTML = nums.map(n => `<option value="${n}">${n}</option>`).join('');
  if (!nums.includes(vs)) vs = nums[0];
  vsSel.value = vs;
}

async function init() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    card.textContent = 'No se pudo cargar ' + DATA_URL + ' · ' + err;
    return;
  }
  const chs = Object.keys(data.chapters).map(Number).sort((a,b)=>a-b);
  chSel.innerHTML = chs.map(n => `<option value="${n}">${n}</option>`).join('');
  chSel.value = ch;
  fillVerses();
  render();
  chSel.onchange = () => { ch = +chSel.value; fillVerses(); render(); };
  vsSel.onchange = () => { vs = +vsSel.value; render(); };
  document.querySelectorAll('.toggles input').forEach(el => el.addEventListener('change', layers));
}
init();
</script>
</body>
</html>
